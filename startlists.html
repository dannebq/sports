<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Results - Fixtures</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <h1>Football Results</h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="results.html">Results</a></li>
                    <li><a href="startlists.html" class="active">Fixtures</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="container">
                <h3>Upcoming Fixtures</h3>

                <div class="filter-section">
                    <div class="filter-controls">
                        <select id="sport-filter">
                            <option value="">All Leagues</option>
                            <option value="allsvenskan">Allsvenskan</option>
                            <option value="premierleague">Premier League</option>
                        </select>

                        <select id="event-filter">
                            <option value="">All Matchdays</option>
                        </select>
                    </div>
                </div>

                <div id="startlist-display">
                    <!-- Start lists will be loaded here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Football Results - 2025</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="startlists.js"></script>
</body>
</html>
