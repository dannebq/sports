<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Football Results - Match Results</title>
    <link rel="stylesheet" href="styles.css?v=4">
</head>
<body>
    <header>
        <nav class="navbar">
            <div class="container">
                <div class="logo">
                    <h1>Football Results</h1>
                </div>
                <ul class="nav-menu">
                    <li><a href="index.html">Home</a></li>
                    <li><a href="results.html" class="active">Results</a></li>
                    <li><a href="startlists.html">Fixtures</a></li>
                </ul>
            </div>
        </nav>
    </header>

    <main>
        <section>
            <div class="container">
                <h3>Match Results</h3>

                <div class="filter-section">
                    <div class="filter-controls">
                        <select id="sport-filter">
                            <option value="">All Leagues</option>
                            <option value="allsvenskan">Allsvenskan</option>
                            <option value="premierleague">Premier League</option>
                        </select>

                        <select id="event-filter">
                            <option value="">All Matchdays</option>
                        </select>

                        <button id="refresh-btn" class="refresh-btn" onclick="footballFetcher.fetchAllResults()">Refresh</button>
                        <span id="last-update" class="last-update"></span>
                    </div>
                </div>

                <div id="results-display">
                    <!-- Results will be loaded here by JavaScript -->
                </div>
            </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>Football Results - 2025</p>
        </div>
    </footer>

    <script src="data.js"></script>
    <script src="config.js"></script>
    <script src="api-fetch.js"></script>
    <script src="results.js"></script>
</body>
</html>
